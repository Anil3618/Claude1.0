name: Sync MLB Schedule

on:
  schedule:
    # Every 6 hours: midnight, 6am, noon, 6pm UTC
    - cron: "0 0,6,12,18 * * *"
  workflow_dispatch:  # Allow manual trigger from GitHub Actions UI

jobs:
  sync:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run schedule sync
        run: python scripts/sync_schedule.py

      - name: Commit updated schedule.json
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add web/public/data/schedule.json
          # Only commit if there are actual changes
          git diff --cached --quiet || git commit -m "chore: sync MLB schedule $(date -u '+%Y-%m-%d %H:%M UTC')"

      - name: Push changes
        run: git push
